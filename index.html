<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koma</title>
</head>
<body>
  <main class="desk-stage" id="desk-stage">
    <section class="rt01-unit" id="rt01-unit" aria-label="桌面音乐播放器">
      <div class="rt01-wood-frame" id="rt01-wood-frame">
        <div class="rt01-faceplate" id="rt01-faceplate">

          <!-- UPPER SECTION: 6x9 Vector Acoustic Matrix + Compact 1:1 Square Micro-CRT Tube -->
          <div class="rt01-upper">
            <div class="rt01-grille" id="rt01-grille" aria-hidden="true">
              <div class="rt01-cone-shadow" id="rt01-cone"></div>
              <svg class="rt01-grille-svg" id="rt01-grille-svg" viewBox="0 0 108 208"></svg>
            </div>

            <div class="crt-cutout">
              <div class="crt-gasket">
                <div class="crt-tube" id="crt-tube">
                  <div class="crt-ambient-bg" id="crt-ambient-bg"></div>
                  <div class="crt-beam-flash" id="crt-beam-flash"></div>

                  <div class="crt-raster" id="crt-raster">
                    <header class="crt-topbar">
                      <button class="crt-band-tag" id="crt-band-btn" title="切换专辑频道">
                        <span class="crt-lock-dot" id="crt-lock-dot"></span>
                        <span id="crt-freq-text">01 · 19.4</span>
                      </button>

                      <nav class="crt-tabs" aria-label="显示模式">
                        <button class="crt-tab active" data-mode="cover" title="封面">画</button>
                        <button class="crt-tab" data-mode="lyrics" title="歌词">词</button>
                        <button class="crt-tab" data-mode="menu" title="选曲">选</button>
                        <button class="crt-tab" data-mode="settings" title="设置">设</button>
                      </nav>
                    </header>

                    <!-- EMPTY LIBRARY VIEW -->
                    <div class="crt-empty-state" id="crt-empty-state">
                      <button class="crt-empty-primary" data-import-kind="files">+ 导入音乐</button>
                      <button class="crt-empty-secondary" data-import-kind="folder">选择文件夹</button>
                    </div>

                    <!-- VIEW 1: COVER + LIVE ELECTRON-BEAM OSCILLOSCOPE -->
                    <div class="crt-view active" id="view-cover">
                      <div class="crt-cover-layout" id="crt-cover-layout">
                        <div class="crt-art-frame" id="crt-art-frame" title="点击放大或还原封面">
                          <img id="crt-cover-img" alt="专辑封面" draggable="false" />
                          <div class="crt-art-scan"></div>
                        </div>

                        <div class="crt-meta-col">
                          <div class="crt-track-no" id="crt-track-no">01 / --</div>
                          <div class="crt-song-title" id="crt-song-title">未播放</div>
                          <div class="crt-album-title" id="crt-album-title"></div>

                          <div class="crt-scope-box">
                            <canvas id="crt-scope" width="196" height="60"></canvas>
                            <div class="crt-time-row">
                              <span id="crt-time-cur">0:00</span>
                              <span id="crt-time-dur">0:00</span>
                            </div>
                          </div>
                        </div>

                        <div class="crt-fullart-caption" id="crt-fullart-caption">
                          <span id="crt-fullart-title">未播放</span>
                        </div>
                      </div>
                    </div>

                    <!-- VIEW 2: SYNCHRONIZED PHOSPHOR LYRICS -->
                    <div class="crt-view" id="view-lyrics">
                      <div class="crt-lyrics-scroll" id="crt-lyrics-scroll"></div>
                    </div>

                    <!-- VIEW 3: CRT OSD ALBUM & TRACK MENU -->
                    <div class="crt-view" id="view-menu">
                      <div class="crt-menu-albums" id="crt-menu-albums"></div>
                      <div class="crt-menu-tracks" id="crt-menu-tracks"></div>
                    </div>

                    <!-- VIEW 4: ALBUM COVER CAROUSEL & MULTI-PACK MANAGER -->
                    <div class="crt-view" id="view-settings">
                      <div class="crt-mgr-bar" id="crt-mgr-bar"></div>
                      <div class="crt-carousel-stage" id="crt-carousel-stage">
                        <div class="crt-carousel-track" id="crt-carousel-track"></div>
                      </div>
                      <div class="crt-carousel-footer" id="crt-carousel-footer"></div>
                    </div>

                    <!-- Missing Music Pack Prompt Overlay -->
                    <div class="crt-missing-prompt" id="crt-missing-prompt" hidden>
                      <div class="crt-missing-card">
                        <div class="crt-missing-badge">未找到音乐包</div>
                        <div class="crt-missing-name" id="crt-missing-name"></div>
                        <div class="crt-missing-desc">原文件已移动或移除，请重新选择或移除。</div>
                        <div class="crt-missing-actions">
                          <button type="button" class="crt-mgr-btn primary" id="crt-missing-relocate">重新选择</button>
                          <button type="button" class="crt-mgr-btn danger" id="crt-missing-remove">移除</button>
                          <button type="button" class="crt-mgr-btn ghost" id="crt-missing-dismiss">稍后</button>
                        </div>
                      </div>
                    </div>

                    <!-- Transient CRT Volume Phosphor OSD -->
                    <div class="crt-vol-osd" id="crt-vol-osd">
                      <span class="crt-vol-label">音量</span>
                      <span class="crt-vol-bars" id="crt-vol-bars">▮▮▮▮▮▮▮▮▯▯</span>
                      <span id="crt-vol-num">76</span>
                    </div>
                  </div>

                  <div class="crt-scanlines" aria-hidden="true"></div>
                  <div class="crt-vignette" aria-hidden="true"></div>
                  <div class="crt-glass-glare" aria-hidden="true"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- LOWER SECTION: Analog Scale + 2 Small Tactile Controls + Big Rotary Dial -->
          <div class="rt01-lower">
            <div class="rt01-left-cluster">
              <div class="rt01-scale-window" id="rt01-scale">
                <div class="scale-plate">
                  <div class="scale-ticks-major"></div>
                  <div class="scale-center-line"></div>
                </div>
                <div class="rt01-needle" id="rt01-needle"></div>
                <div class="rt01-prog-track">
                  <div class="rt01-prog-fill" id="rt01-prog"></div>
                </div>
              </div>

              <div class="rt01-small-controls">
                <div class="small-ctrl-slot">
                  <span class="pilot-led" id="rt01-led"></span>
                  <button class="neo-small-btn" id="rt01-play-btn" aria-label="播放或暂停">
                    <svg id="rt01-play-icon" width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
                      <path d="M5.4 3.6L12.8 8L5.4 12.4V3.6Z" />
                    </svg>
                  </button>
                </div>

                <div class="small-ctrl-slot">
                  <svg class="small-collar-dots" viewBox="0 0 64 64" aria-hidden="true">
                    <circle cx="13" cy="48" r="1.1" /><circle cx="9" cy="33" r="1.1" />
                    <circle cx="15" cy="18" r="1.1" /><circle cx="32" cy="11" r="1.3" />
                    <circle cx="49" cy="18" r="1.1" /><circle cx="55" cy="33" r="1.1" />
                    <circle cx="51" cy="48" r="1.1" />
                  </svg>
                  <div class="neo-small-knob" id="rt01-vol-knob" role="slider" aria-label="音量与视图切换">
                    <div class="knob-rotor" id="rt01-vol-rotor">
                      <span class="small-rotor-mark"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="rt01-big-dial-well">
              <svg class="big-dial-collar" viewBox="0 0 132 132" aria-hidden="true">
                <g fill="#b5b2a8">
                  <circle cx="66" cy="8" r="1.3"/><circle cx="95" cy="16" r="1.2"/><circle cx="116" cy="37" r="1.2"/>
                  <circle cx="124" cy="66" r="1.3"/><circle cx="116" cy="95" r="1.2"/><circle cx="95" cy="116" r="1.2"/>
                  <circle cx="66" cy="124" r="1.3"/><circle cx="37" cy="116" r="1.2"/><circle cx="16" cy="95" r="1.2"/>
                  <circle cx="8" cy="66" r="1.3"/><circle cx="16" cy="37" r="1.2"/><circle cx="37" cy="16" r="1.2"/>
                </g>
              </svg>
              <div class="rt01-big-dial" id="rt01-tune-dial">
                <div class="knob-rotor" id="rt01-tune-rotor">
                  <span class="big-rotor-mark"></span>
                </div>
                <div class="big-dial-dimple"></div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- Hidden Browser-Preview File Pickers (used when running in browser outside Tauri) -->
    <input type="file" id="browser-file-input" multiple accept=".flac,.mp3,.m4a,.wav,.ogg,.opus,.aac,.webm,.zip,.lrc,.jpg,.jpeg,.png,.webp,audio/*,image/*" hidden />
    <input type="file" id="browser-folder-input" webkitdirectory multiple hidden />
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
