[package]
name = "yoru-rt01"
version = "0.1.0"
description = "Yorushika RT-01 Neo-Skeuomorphic Micro-CRT Desktop Player"
authors = ["Yoru Studio"]
edition = "2021"

[lib]
name = "yoru_rt01_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
